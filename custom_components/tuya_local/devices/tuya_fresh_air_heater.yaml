name: Fresh air heater
products:
  - id: rhpqgxqyxpwpk4j3
entities:
  - entity: fan
    translation_key: ventilation
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 3
        type: integer
        name: speed
        range:
          min: 1
          max: 3
  - entity: select
    name: Mode
    icon: "mdi:thermostat"
    dps:
      - id: 2
        type: string
        name: option
        mapping:
          - dps_val: heat
            value: Heat
          - dps_val: supply
            value: Supply
  - entity: sensor
    class: temperature
    dps:
      - id: 21
        type: integer
        name: sensor
        unit: C
  - entity: switch
    translation_key: ionizer
    category: config
    dps:
      - id: 9
        type: boolean
        name: switch
  - entity: light
    translation_key: indicator
    category: config
    dps:
      - id: 15
        type: boolean
        name: switch
